<div class="page">
  <div class="crumb">
    <span>T3RM</span><span class="sep">/</span><span class="now">DATA</span>
  </div>
  <div class="flex justify-between items-center mb-14" style="margin-top: 4px">
    <h1>Marché</h1>
    <div class="flex gap-8">
      <div class="seg">
        <button [class.on]="ticker() === 'sp500'" (click)="ticker.set('sp500')">SP500</button>
        <button [class.on]="ticker() === 'nasdaq'" (click)="ticker.set('nasdaq')">NASDAQ</button>
      </div>
      <div class="seg">
        <button [class.on]="period() === '1D'" (click)="period.set('1D')">1D</button>
        <button [class.on]="period() === '1M'" (click)="period.set('1M')">1M</button>
        <button [class.on]="period() === '1Y'" (click)="period.set('1Y')">1Y</button>
        <button [class.on]="period() === '5Y'" (click)="period.set('5Y')">5Y</button>
      </div>
    </div>
  </div>

  @if (isLoading()) {
    <div class="panel">
      <div class="panel-body" style="text-align: center; padding: 40px">
        <span class="muted" style="font-size: 11px; letter-spacing: 0.14em">CHARGEMENT DES DONNÉES…</span>
      </div>
    </div>
  } @else if (errorMessage()) {
    <div class="panel">
      <div class="panel-body" style="text-align: center; padding: 40px">
        <span class="neg" style="font-size: 11px; letter-spacing: 0.14em">✕ {{ errorMessage() }}</span>
      </div>
    </div>
  } @else if (marketData().length > 0) {
    <div class="panel">
      <div class="panel-header">
        <div class="title">OHLC · {{ ticker().toUpperCase() }} · {{ period() }}</div>
        <div class="actions">
          <span class="muted">candles</span>
          <span class="chip">UTC</span>
        </div>
      </div>
      <div class="panel-body">
        <app-market-chart
          [data]="marketData()"
          [period]="period()"
          [ticker]="ticker()"
        ></app-market-chart>
      </div>
    </div>
  }
</div>
