<h1>Data Page</h1>

<div style="display: flex; gap: 16px; align-items: center; margin-bottom: 20px; margin-top: 30px;">
  <mat-form-field>
    <mat-label>Data Base</mat-label>
    <mat-select [value]="ticker()" (selectionChange)="ticker.set($event.value)">
        <mat-option value="sp500">S&P 500</mat-option>
        <mat-option value="nasdaq">NASDAQ</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Time Period</mat-label>
    <mat-select [value]="period()" (selectionChange)="period.set($event.value)">
        <mat-option value="1D">1 Day</mat-option>
        <mat-option value="1M">1 Month</mat-option>
        <mat-option value="1Y">1 Year</mat-option>
        <mat-option value="5Y">5 Years</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div style="margin-top: 20px;">
  @if (isLoading()) {
    <p><mat-icon>hourglass</mat-icon> Récupération des données...</p>
  } @else if (errorMessage()) {
    <p class="error-text"><mat-icon>close</mat-icon> {{ errorMessage() }}</p>
  } @else if (marketData().length > 0) {
    <div class="chart-container">
      <app-market-chart
        [data]="marketData()"
        [period]="period()"
        [ticker]="ticker()"
      ></app-market-chart>
    </div>
  }
</div>
