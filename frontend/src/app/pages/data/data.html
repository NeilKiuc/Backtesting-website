<h1>Data Page</h1>

<div style="display: flex; gap: 16px; align-items: center; margin-bottom: 20px; margin-top: 30px;">
  <mat-form-field>
    <mat-label>Data Base</mat-label>
    <mat-select [value]="ticker()" (selectionChange)="ticker.set($event.value)">
        <mat-optgroup label="US">
            <mat-option value="sp500">S&P 500</mat-option>
            <mat-option value="nasdaq">NASDAQ</mat-option>
            <mat-option value="nq">Nasdaq Futures</mat-option>
        </mat-optgroup>
        <mat-optgroup label="International">
            <mat-option value="cac40">CAC 40</mat-option>
            <mat-option value="dax">DAX</mat-option>
            <mat-option value="ftse100">FTSE 100</mat-option>
            <mat-option value="nikkei">Nikkei 225</mat-option>
            <mat-option value="hangseng">Hang Seng</mat-option>
        </mat-optgroup>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Time Period</mat-label>
    <mat-select [value]="period()" (selectionChange)="period.set($event.value)">
        <mat-option value="1D">1 Day</mat-option>
        <mat-option value="1M">1 Month</mat-option>
        <mat-option value="1Y">1 Year</mat-option>
        <mat-option value="5Y">5 Years</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div style="margin-top: 20px;">
  @if (isLoading()) {
    <p><mat-icon>hourglass</mat-icon> Récupération des données...</p>
  } @else if (errorMessage()) {
    <p style="color: red;"><mat-icon>close</mat-icon> {{ errorMessage() }}</p>
  } @else if (marketData().length > 0) {
    <div style="background: #f4f4f4; padding: 15px; border-radius: 8px; width: 100%; box-sizing: border-box;">
      <app-market-chart
        [data]="marketData()"
        [period]="period()"
        [ticker]="ticker()"
      ></app-market-chart>
    </div>
  }
</div>
